# Copies the breakthrough model's files to where the worker can still find
# them if the original upload is deleted or made private (the worker's order:
# RunPod's cache → your own HF repository → the original → R2; see
# runpod-worker/llamacpp/handler.py).
#
# Run by hand only. Two destinations, either or both:
#
#   hf_repo  A Hugging Face repository of your own, private by default. The
#            Hub copies the files server-side, so this moves nothing through
#            the runner and takes minutes. Holding just this quant, it is also
#            what RunPod's model cache should point at: 84 GB, not 281.
#            Needs secret HF_TOKEN (a write token).
#   bucket   Cloudflare R2. Each file streams through the runner into a
#            multipart upload (never touching its disk), is checked against
#            the sha256 Hugging Face records, and is read back and checked
#            again. ~84 GB through the runner. Needs secrets R2_ACCOUNT_ID,
#            R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
#
# Rerunning skips files already copied and checked.
name: mirror model

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Source Hugging Face repository
        default: SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF
      revision:
        description: Source commit sha (40 characters, not a branch)
        default: eec4e10a2c29b440a2ae85591fa11569ce752963
      folder:
        description: Quant folder
        default: IQ3_S
      hf_repo:
        description: Your own HF repository to copy to (owner/name; empty = skip)
        default: ''
      hf_public:
        description: Create that repository public (default private)
        type: boolean
        default: false
      bucket:
        description: R2 bucket to copy to (empty = skip)
        default: ''
      dry_run:
        description: List the files and check access only
        type: boolean
        default: true
      verify:
        description: R2 only — read each file back and hash it again (free egress; doubles the time)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mirror-model
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # R2: two passes over 84 GB. GitHub's own ceiling is six hours.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the copier
        run: python -I scripts/test_mirror_model.py

      # The latest huggingface_hub: copying between repositories (src_repo_id)
      # is recent.
      - name: Install
        run: pip install -U "huggingface_hub" "boto3>=1.36" "requests>=2.31"

      - name: Copy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REPO: ${{ inputs.repo }}
          REVISION: ${{ inputs.revision }}
          FOLDER: ${{ inputs.folder }}
          HF_REPO: ${{ inputs.hf_repo }}
          HF_PUBLIC: ${{ inputs.hf_public }}
          BUCKET: ${{ inputs.bucket }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERIFY: ${{ inputs.verify }}
        run: |
          set -euo pipefail
          if [ -z "$HF_REPO" ] && [ -z "$BUCKET" ]; then
            echo "::error::hf_repo か bucket のどちらかを指定してください"; exit 1
          fi
          if [ -n "$HF_REPO" ] && [ -z "$HF_TOKEN" ]; then
            echo "::error::secret HF_TOKEN is not set"; exit 1
          fi
          if [ -n "$BUCKET" ]; then
            for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
              if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; exit 1; fi
            done
          fi
          args=(--repo "$REPO" --revision "$REVISION" --folder "$FOLDER")
          if [ -n "$HF_REPO" ]; then args+=(--to-hf "$HF_REPO"); fi
          if [ "$HF_PUBLIC" = "true" ]; then args+=(--public); fi
          if [ -n "$BUCKET" ]; then args+=(--bucket "$BUCKET"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$VERIFY" != "true" ]; then args+=(--no-verify); fi
          python scripts/mirror_model.py "${args[@]}"
