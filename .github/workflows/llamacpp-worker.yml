# Builds the RunPod llama.cpp worker (runpod-worker/llamacpp) and publishes it
# to GHCR, where breakthrough mode's endpoint template pulls it from.
name: llama.cpp worker image

on:
  push:
    branches: [main]
    paths:
      - 'runpod-worker/llamacpp/**'
      - '.github/workflows/llamacpp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llamacpp-worker
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aitaro0214/hyperai-llamacpp-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The cache lookup and its fallback, before anything is published.
      - name: Test the handler
        run: python3 -I runpod-worker/llamacpp/test_handler.py

      # <llama.cpp build>-<WORKER_VERSION>, both read from the Dockerfile. The
      # app names the image itself, so a tag it does not name would never run.
      - name: Work out the tag
        id: tag
        run: |
          build=$(sed -n 's/^FROM .*:server-cuda-\(b[0-9][0-9]*\).*/\1/p' runpod-worker/llamacpp/Dockerfile)
          version=$(sed -n 's/^ENV WORKER_VERSION=\([0-9][0-9]*\).*/\1/p' runpod-worker/llamacpp/Dockerfile)
          test -n "$build" && test -n "$version"
          tag="$build-$version"
          if ! grep -q "hyperai-llamacpp-worker:$tag'" src/lib/runpod.js; then
            echo "::error::LLAMACPP_IMAGE in src/lib/runpod.js does not name $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The CUDA base image is several GB; the runner's default free space is tight.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: runpod-worker/llamacpp
          platforms: linux/amd64
          push: true
          # A plain single-platform manifest: attestations add an
          # "unknown/unknown" entry that some pullers trip over.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
